# .github/workflows/consumer.yml
name: Consumer Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pipeline-node20:
    name: Pipeline (Node 20)
    uses: ./.github/workflows/reusable-node.yml
    with:
      node-version: '20'
      artifact-name: 'lab2'
      retention-days: 5

  pipeline-node22:
    name: Pipeline (Node 22)
    uses: ./.github/workflows/reusable-node.yml
    with:
      node-version: '22'
      artifact-name: 'lab2'
      retention-days: 5

  summary:
    name: Resumen de resultados
    runs-on: ubuntu-latest
    needs: [pipeline-node20, pipeline-node22]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar resultados
        run: |
          echo "## Resultados del pipeline" >> $GITHUB_STEP_SUMMARY
          echo "| Versión Node | Tests | Artifact ID |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 20 | ${{ needs.pipeline-node20.outputs.test-result }} | ${{ needs.pipeline-node20.outputs.artifact-id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 22 | ${{ needs.pipeline-node22.outputs.test-result }} | ${{ needs.pipeline-node22.outputs.artifact-id }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fallar si algún test falló
        if: |
          needs.pipeline-node20.outputs.test-result == 'failed' ||
          needs.pipeline-node22.outputs.test-result == 'failed'
        run: |
          echo "❌ Alguno de los pipelines falló"
          exit 1

      - name: Descargar artifacts de Node 20
        uses: actions/download-artifact@v4
        with:
          name: lab2-build-node20
          path: downloaded-artifacts/node20

      - name: Lógica adicional — verificar binario
        run: |
          echo "Archivos descargados:"
          ls -la downloaded-artifacts/node20/
