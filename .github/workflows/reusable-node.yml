# .github/workflows/reusable-node.yml
name: Reusable Node.js Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Versión de Node.js a usar'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Directorio de trabajo'
        required: false
        type: string
        default: '.'
      artifact-name:
        description: 'Nombre base para los artifacts'
        required: true
        type: string
      retention-days:
        description: 'Días de retención de artifacts'
        required: false
        type: number
        default: 7

    outputs:
      test-result:
        description: 'Resultado de los tests (passed/failed)'
        value: ${{ jobs.build-and-test.outputs.test-result }}
      artifact-id:
        description: 'ID del artifact generado'
        value: ${{ jobs.build-and-test.outputs.artifact-id }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    outputs:
      test-result: ${{ steps.run-tests.outputs.result }}
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ inputs.node-version }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests
        id: run-tests
        run: |
          set +e
          npm test > test-report.tap 2>&1
          EXIT_CODE=$?
          cat test-report.tap
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Upload build artifact
        id: upload-build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-build-node${{ inputs.node-version }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-test-report-node${{ inputs.node-version }}
          path: ${{ inputs.working-directory }}/test-report.tap
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn
